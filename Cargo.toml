[package]
name = "stryke-gcp"
version = "0.2.0"
edition = "2021"
description = "Google Cloud cdylib for stryke. Dlopened in-process with a persistent tokio runtime + reqwest client + auth TokenSource. v0.2.0 covers GCS + Pub/Sub — focused subset of the v1 helper."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-gcp"
homepage = "https://menketechnologies.github.io/stryke-gcp/"
publish = false

[lib]
name = "stryke_gcp"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
google-cloud-auth = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
base64 = "0.22"
urlencoding = "2"
once_cell = "1"
parking_lot = "0.12"
http = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
