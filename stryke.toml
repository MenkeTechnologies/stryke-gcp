[package]
name = "stryke-gcp"
version = "0.19.0"
description = "Google Cloud client for stryke — Storage, Pub/Sub, Secret Manager, BigQuery, Firestore, Compute Engine, Cloud Run, Cloud Functions, Cloud Logging, Cloud Monitoring, and IAM. cdylib loaded in-process — persistent tokio runtime + reqwest client + ADC credentials cache."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-gcp"
edition = "2026"

[ffi]
lib-name = "stryke_gcp"
namespace = "GCP"
exports = [
    "gcp__pkg_version",
    "gcp__identity",
    "gcp__gcs_list_buckets",
    "gcp__gcs_list_objects",
    "gcp__gcs_get_object",
    "gcp__gcs_put_object",
    "gcp__gcs_delete_object",
    "gcp__pubsub_publish",
    "gcp__pubsub_pull",
    "gcp__pubsub_ack",
    "gcp__gcs_head_object",
    "gcp__gcs_copy_object",
    "gcp__pubsub_list_topics",
    "gcp__pubsub_list_subscriptions",
    "gcp__pubsub_create_topic",
    "gcp__pubsub_create_subscription",
    "gcp__secret_access",
    "gcp__secret_create",
    "gcp__secret_add_version",
    "gcp__pubsub_delete_topic",
    "gcp__pubsub_delete_subscription",
    "gcp__bigquery_query",
    "gcp__bigquery_insert",
    "gcp__gcs_compose",
    "gcp__firestore_get",
    "gcp__firestore_set",
    "gcp__firestore_delete",
    "gcp__firestore_list",
    "gcp__firestore_query",
    "gcp__firestore_create",
    "gcp__parse_gs_uri",
    "gcp__build_gs_uri",
    "gcp__gs_uri_to_url",
    "gcp__url_to_gs_uri",
    "gcp__parse_resource_name",
    "gcp__resource_name_parent",
    "gcp__build_resource_name",
    "gcp__parse_table_ref",
    "gcp__build_table_ref",
    "gcp__valid_bucket_name",
    "gcp__valid_project_id",
    "gcp__valid_object_name",
    "gcp__region_for_zone",
    "gcp__valid_label",
    "gcp__valid_pubsub_id",
    "gcp__valid_service_account_id",
    "gcp__valid_secret_id",
    "gcp__valid_dataset_id",
    "gcp__valid_table_id",
    "gcp__compute_list_instances",
    "gcp__compute_get_instance",
    "gcp__compute_start_instance",
    "gcp__compute_stop_instance",
    "gcp__compute_reset_instance",
    "gcp__compute_list_zones",
    "gcp__run_list_services",
    "gcp__run_get_service",
    "gcp__run_list_revisions",
    "gcp__functions_list",
    "gcp__functions_describe",
    "gcp__logging_list_entries",
    "gcp__logging_write_entry",
    "gcp__logging_list_logs",
    "gcp__monitoring_list_time_series",
    "gcp__monitoring_list_metric_descriptors",
    "gcp__secret_list",
    "gcp__iam_get_policy",
    "gcp__iam_test_permissions",
    "gcp__iam_list_service_accounts",
    "gcp__iam_get_service_account",
    "gcp__bigquery_list_datasets",
    "gcp__bigquery_get_dataset",
    "gcp__bigquery_list_tables",
    "gcp__bigquery_get_table",
    "gcp__gcs_get_iam_policy",
    "gcp__gcs_set_iam_policy",
    "gcp__compute_list_regions",
    "gcp__compute_list_machine_types",
    "gcp__compute_list_disks",
    "gcp__pubsub_get_topic",
    "gcp__pubsub_topic_subscriptions",
    "gcp__secret_list_versions",
    "gcp__secret_delete",
    "gcp__bigquery_list_jobs",
]

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
