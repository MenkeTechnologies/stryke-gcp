[package]
name = "stryke-gcp"
version = "0.2.1"
description = "Google Cloud client (GCS + Pub/Sub) for stryke. cdylib loaded in-process — persistent tokio runtime + reqwest client + ADC credentials cache. v0.2.0 focused subset."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-gcp"
edition = "2026"

[ffi]
lib-name = "stryke_gcp"
namespace = "GCP"
exports = [
    "gcp__pkg_version",
    "gcp__identity",
    "gcp__gcs_list_buckets",
    "gcp__gcs_list_objects",
    "gcp__gcs_get_object",
    "gcp__gcs_put_object",
    "gcp__gcs_delete_object",
    "gcp__pubsub_publish",
    "gcp__pubsub_pull",
    "gcp__pubsub_ack",
    "gcp__gcs_head_object",
    "gcp__gcs_copy_object",
    "gcp__pubsub_list_topics",
    "gcp__pubsub_list_subscriptions",
    "gcp__pubsub_create_topic",
    "gcp__pubsub_create_subscription",
    "gcp__secret_access",
    "gcp__secret_create",
    "gcp__secret_add_version",
    "gcp__pubsub_delete_topic",
    "gcp__pubsub_delete_subscription",
    "gcp__bigquery_query",
    "gcp__bigquery_insert",
    "gcp__gcs_compose",
    "gcp__firestore_get",
    "gcp__firestore_set",
    "gcp__firestore_delete",
    "gcp__firestore_list",
]

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
