[package]
name = "gcp"
version = "0.1.0"
description = "Google Cloud client (GCS, BigQuery, Pub/Sub) for stryke. Opt-in package tier; keeps the stryke core binary slim."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-gcp"
edition = "2026"

[bin]
gcp = "bin/gcp.stk"
gcp-build = "bin/gcp-build.stk"

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
